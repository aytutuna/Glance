name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Glance.csproj -c Release
      - run: dotnet test tests/Glance.Tests -c Release

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate --spec mac/project.yml
      - run: xcodebuild test -project mac/Glance.xcodeproj -scheme Glance -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

  mac-ui:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate --spec mac/project.yml
      - run: xcodebuild build-for-testing -project mac/Glance.xcodeproj -scheme GlanceUI -destination 'platform=macOS' -derivedDataPath build CODE_SIGN_IDENTITY=-
      - name: Run the UI tests
        run: |
          mkdir -p ui
          # SIP is off on the runner image, so Screen Recording can be granted straight in the database
          now=$(date +%s)
          # the app started by a UI test is held responsible by the test runner, so the runner needs the grant too
          for client in com.aytutuna.glance com.aytutuna.glance.uitests com.aytutuna.glance.uitests.xctrunner; do
            row="INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$client',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now);"
            sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$row"
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "$row"
          done
          python3 mac/GlanceUITests/fake_ai.py 8123 ui/fake-ai.log &
          app=build/Build/Products/Debug/Glance.app
          # macOS asks once per app whether it may bypass the window picker; answer it before the tests so it never covers them
          mkdir -p "$HOME/Library/Application Support/Glance"
          echo '{"provider":"custom","order":["custom"],"customUrl":"http://127.0.0.1:8123/v1","providerModels":{"custom":"fake-model"},"checkUpdates":false}' > "$HOME/Library/Application Support/Glance/settings.json"
          open "$app"
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "q" using {control down, shift down}'
          for i in $(seq 20); do
            sleep 1
            osascript -e 'tell application "System Events" to click button "Allow" of window 1 of process "UserNotificationCenter"' 2>/dev/null && break
          done
          sleep 2
          pkill -x Glance || true
          set +e
          xcodebuild test-without-building -project mac/Glance.xcodeproj -scheme GlanceUI -destination 'platform=macOS' -derivedDataPath build -resultBundlePath ui/ui.xcresult
          status=$?
          screencapture -x ui/desktop-end.png
          exit $status
      - name: Export the screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path ui/ui.xcresult --output-path ui/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-ui-shots
          path: |
            ui/shots
            ui/fake-ai.log
            ui/desktop-end.png
          retention-days: 7
