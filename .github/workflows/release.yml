name: release

on: workflow_dispatch

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          csproj=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Glance.csproj | head -1)
          mac=$(sed -n 's|.*MARKETING_VERSION: "\(.*\)".*|\1|p' mac/project.yml | head -1)
          echo "Glance.csproj $csproj, mac/project.yml $mac"
          [ -n "$csproj" ] && [ "$csproj" = "$mac" ] || { echo "The Mac version does not match Glance.csproj"; exit 1; }
          echo "VERSION=$csproj" >> "$GITHUB_ENV"
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: xcodegen generate --spec mac/project.yml
      - name: Write the API key
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"
      # Archived ad hoc and signed on export, as in the Mac App Store workflow of the other apps: an automatically
      # signed archive wants a development profile, which needs a registered Mac.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project mac/Glance.xcodeproj \
            -scheme Glance \
            -configuration Release \
            -destination generic/platform=macOS \
            -archivePath "$RUNNER_TEMP/Glance.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
      - name: Sign with Developer ID
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Glance.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
      - name: Check the signature
        run: |
          app="$RUNNER_TEMP/export/Glance.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/codesign.txt"
          grep -q "flags=.*runtime" "$RUNNER_TEMP/codesign.txt"
      - name: Notarize
        run: |
          app="$RUNNER_TEMP/export/Glance.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          key="$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID"
            echo "Notarization $status"
            exit 1
          fi
      - name: Staple and pack
        run: |
          app="$RUNNER_TEMP/export/Glance.app"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"
          mkdir -p macos
          ditto -c -k --keepParent "$app" "macos/Glance-$VERSION-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: macos/Glance-*-mac.zip
          retention-days: 1
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  release:
    needs: mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
      - uses: actions/download-artifact@v4
        with:
          name: mac-zip
          path: macos
      - name: Build
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ([xml](Get-Content Glance.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "tag $tag already exists" }
          gh release create $tag --title "Glance $version" --target $env:GITHUB_SHA `
            "publish/Glance-$version-x64.exe" "publish/Glance-$version-arm64.exe" "publish/Glance-$version-setup.exe" "macos/Glance-$version-mac.zip"
