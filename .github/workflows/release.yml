name: release

on: workflow_dispatch

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          csproj=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Glance.csproj | head -1)
          mac=$(sed -n 's|.*MARKETING_VERSION: "\(.*\)".*|\1|p' mac/project.yml | head -1)
          echo "Glance.csproj $csproj, mac/project.yml $mac"
          [ -n "$csproj" ] && [ "$csproj" = "$mac" ] || { echo "The Mac version does not match Glance.csproj"; exit 1; }
          echo "VERSION=$csproj" >> "$GITHUB_ENV"
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: xcodegen generate --spec mac/project.yml
      # Ad hoc signed and not notarized, like the Windows build is unsigned.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project mac/Glance.xcodeproj \
            -scheme Glance \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
      - name: Check and pack
        run: |
          app="$RUNNER_TEMP/build/Build/Products/Release/Glance.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app"
          lipo -archs "$app/Contents/MacOS/Glance"
          mkdir -p macos
          ditto -c -k --keepParent "$app" "macos/Glance-$VERSION-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: macos/Glance-*-mac.zip
          retention-days: 1

  release:
    needs: mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
      - uses: actions/download-artifact@v4
        with:
          name: mac-zip
          path: macos
      - name: Build
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ([xml](Get-Content Glance.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "tag $tag already exists" }
          gh release create $tag --title "Glance $version" --target $env:GITHUB_SHA `
            "publish/Glance-$version-x64.exe" "publish/Glance-$version-arm64.exe" "publish/Glance-$version-setup.exe" "macos/Glance-$version-mac.zip"
